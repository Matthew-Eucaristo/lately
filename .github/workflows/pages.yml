name: pages
# Publishes site/ to GitHub Pages: https://matthew-eucaristo.github.io/lately/
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "demo/**", "internal/**", "*.go", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version shown on the page
      # The page's interactive demo is lately's own replay of demo/sample.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (GIF → MP4 for the recording)
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - run: site/build.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
